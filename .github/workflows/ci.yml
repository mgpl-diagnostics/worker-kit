name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id "ci" is the required status check on main (see mgpl-diagnostics/.github scripts/protect-repos.mjs).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
      REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - name: Tests (definitions, data rules, in-process, fallback, BullMQ on Redis with the same scenario)
        run: npm test
      - run: npm run build
      - name: The main entry does not import bullmq or ioredis
        run: "! grep -E \"from ['\\\"](bullmq|ioredis)['\\\"]\" dist/index.js"
      - name: llms-full.txt is up to date (run `npm run llms` and commit if this fails)
        run: npm run llms && git diff --exit-code -- llms-full.txt
